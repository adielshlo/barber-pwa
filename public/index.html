<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>אחיה הספר</title>
  <meta name="theme-color" content="#08090d" />
  <meta name="description" content="קביעת תור לתספורת באונליין." />
  <meta name="apple-mobile-web-app-title" content="אחיה הספר">
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <span class="orb orb-amber"></span>
    <span class="orb orb-slate"></span>
    <span class="orb orb-bronze"></span>
  </div>

  <div id="splash-screen" aria-hidden="true">
    <div class="splash-logo-container">
      <div class="laser-scan-line"></div>
      <img src="icons/logo.png" alt="Logo" class="splash-logo" />
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="/icons/logo.png" alt="לוגו אחיה הספר" class="brand-logo" />
        <h1>אחיה הספר</h1>
      </div>
      <p>קביעת תור בכמה קליקים</p>
    </header>

    <main>
      <nav class="view-tabs" id="view-tabs">
        <button type="button" class="tab-btn active" data-view="booking">קביעת תור</button>
        <button type="button" class="tab-btn" data-view="my-appointments">התורים שלי</button>
      </nav>

      <div id="booking-view">
        <section class="card">
          <h2>1. בחרו תאריך</h2>
          <div class="day-picker" id="day-picker"></div>
        </section>

        <section class="card" id="slots-section" hidden>
          <h2>2. בחרו שעה</h2>
          <div class="slots-grid" id="slots-grid"></div>
          <p class="empty-state" id="slots-empty" hidden>אין שעות פנויות בתאריך זה.</p>
        </section>
      </div>

      <div id="my-appointments-view" hidden>
        <section class="card" id="phone-lookup-card">
          <h2>הזינו מספר טלפון</h2>
          <div class="field">
            <label for="my-appointments-phone-input">טלפון</label>
            <input type="tel" id="my-appointments-phone-input" inputmode="tel" autocomplete="tel" placeholder="0501234567" />
          </div>
          <button type="button" class="btn" id="my-appointments-search-btn">הצג את התורים שלי</button>
          <p class="error-text" id="my-appointments-error"></p>
        </section>

        <section class="card" id="my-appointments-list-card" hidden>
          <h2>התורים שלי</h2>
          <div id="my-appointments-list"></div>
          <p class="empty-state" id="my-appointments-empty" hidden>אין תורים פעילים.</p>
          <button type="button" class="btn small secondary" id="change-phone-btn">שינוי מספר טלפון</button>
        </section>
      </div>

      <section class="card" id="confirmation-section" hidden>
        <div class="modal-icon">&#10003;</div>
        <h2>התור נקבע בהצלחה</h2>
        <p class="subtitle">נתראה בקרוב!</p>
        <div id="confirm-details"></div>
        <button class="btn" id="confirm-close-btn">חזרה ללוח התורים</button>
      </section>
    </main>
  </div>

  <div class="overlay" id="booking-overlay" hidden>
    <div class="modal">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="סגירה">&times;</button>
      <h2>פרטי ההזמנה</h2>
      <p class="subtitle" id="booking-summary"></p>
      <form id="booking-form">
        <div class="field">
          <label for="name-input">שם מלא</label>
          <input type="text" id="name-input" name="customer_name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="phone-input">טלפון</label>
          <input type="tel" id="phone-input" name="phone" inputmode="tel" autocomplete="tel" />
        </div>
        <div class="field">
          <label for="address-input">כתובת (אופציונלי)</label>
          <input type="text" id="address-input" name="address" autocomplete="street-address" placeholder="כתובת (אופציונלי)" />
        </div>
        <button type="submit" class="btn" id="submit-btn">אישור תור</button>
        <p class="error-text" id="form-error"></p>
      </form>
    </div>
  </div>

  <script src="js/day-picker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
